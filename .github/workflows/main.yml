name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Intel VoodooI2CHID
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - name: Checkout VoodooI2C and satellites
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 8

      - name: Checkout MacKernelSDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: MacKernelSDK
          persist-credentials: false

      - name: Checkout VoodooInput
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: acidanthera/VoodooInput
          ref: d897813718c2ef9ad143b6a86240fe52dcb1693e
          path: Dependencies/VoodooInput/Source
          persist-credentials: false

      - name: Build the VoodooInput SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          xcodebuild -version
          input_root="$GITHUB_WORKSPACE/Dependencies/VoodooInput"
          ln -s "$GITHUB_WORKSPACE/MacKernelSDK" "$input_root/Source/MacKernelSDK"
          for configuration in Debug Release; do
            xcodebuild -project "$input_root/Source/VoodooInput.xcodeproj" \
              -target VoodooInput -configuration "$configuration" \
              CONFIGURATION_BUILD_DIR="$input_root/$configuration" \
              CODE_SIGNING_ALLOWED=NO
            test -d "$input_root/$configuration/VoodooInput.kext"
          done
          test -f "$input_root/Debug/VoodooInput.kext/Contents/Resources/VoodooInputMultitouch/VoodooInputMessages.h"

      - name: Build the matching I2C-HID satellite
        shell: bash
        run: |
          set -euo pipefail
          satellite='VoodooI2C Satellites/VoodooI2CHID'
          test "$(git -C "$satellite" rev-parse HEAD)" = 16f765dab5a364df3106a624be4d2cbf0932dfd6
          core_base=927797d4fcf5aaf2f4ccddd3daafd93f53d3adbf
          git merge-base --is-ancestor "$core_base" HEAD
          build="$RUNNER_TEMP/voodoo-build"
          xcodebuild -workspace VoodooI2C.xcworkspace -scheme VoodooI2C \
            -derivedDataPath "$build" -jobs 1 -configuration Release \
            CODE_SIGNING_ALLOWED=NO
          products="$build/Build/Products/Release"
          bundle="$products/VoodooI2CHID.kext"
          binary="$bundle/Contents/MacOS/VoodooI2CHID"
          test -f "$binary"
          xcrun lipo "$binary" -verify_arch x86_64
          /usr/bin/plutil -lint "$bundle/Contents/Info.plist"
          mkdir artifact
          export COPYFILE_DISABLE=1
          tar -C "$products" -czf artifact/VoodooI2CHID.tar.gz VoodooI2CHID.kext
          (cd artifact && shasum -a 256 VoodooI2CHID.tar.gz > SHA256SUMS)
          {
            printf 'core_base=%s\n' "$core_base"
            printf 'build_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'hid_commit=%s\n' "$(git -C "$satellite" rev-parse HEAD)"
            printf 'mac_kernel_sdk=%s\n' "$(git -C MacKernelSDK rev-parse HEAD)"
            printf 'voodoo_input_commit=%s\n' "$(git -C Dependencies/VoodooInput/Source rev-parse HEAD)"
            printf 'github_run_id=%s\n' "$GITHUB_RUN_ID"
            xcodebuild -version
            xcrun lipo -archs "$binary"
          } > artifact/provenance.txt

      - name: Upload the verified Intel satellite
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VoodooI2CHID-x86_64
          path: artifact/
          if-no-files-found: error
          retention-days: 7
